    <!-- To add a piece: copy one <section> below, then change the heading, images, and captions. -->
    <section class="section flow" aria-labelledby="jewel-tones">
      <h2 id="jewel-tones">Jewel Tones zine cover</h2>
      <figure class="wide">
        <img src="images/graphics/jewel-tones.jpg" width="1600" height="1218" loading="lazy" alt="Zine cover titled 'Jewel Tones': twenty cut gemstones on dark stone, each gem filled with a different artist's illustration, with the line 'A CMU Artist Alley Club zine.'">
        <figcaption>Cover for Jewel Tones, a CMU Artist Alley Club zine. Each gem frames a piece by a different contributor.</figcaption>
      </figure>
    </section>

    <section class="section flow" aria-labelledby="signage">
      <h2 id="signage">Event signage</h2>
      <figure class="wide">
        <div class="grid grid-3">
          <img src="images/graphics/shower-menu.jpg" width="1600" height="2000" loading="lazy" alt="Menu sign in an arched frame over sage stripes, with a line drawing of a set table, watercolor blossoms, and script course headings.">
          <img src="images/graphics/shower-gifts.jpg" width="1600" height="2000" loading="lazy" alt="Gifts sign with a large sage ribbon bow over an arch, spaced serif lettering, and watercolor blossoms along the bottom.">
          <img src="images/graphics/shower-drink-tickets.jpg" width="1600" height="2000" loading="lazy" alt="Drink tickets sign with a line drawing of two champagne glasses tied with bows, script title, and spaced capitals explaining the ticket rules.">
        </div>
        <figcaption>Three signs for one event, tied together by a sage-and-blush palette, ribbon motifs, and the same type pairing.</figcaption>
      </figure>
